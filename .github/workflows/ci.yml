name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Siapkan environment
        run: cp .env.example .env

      - name: Install dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Jalankan feature test
        run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  deploy:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR wajib huruf kecil semua
      - name: Set nama image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          REPO="${REPO#*/}"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/${REPO}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build dan push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Smoke test: jalankan image yang baru terbit memakai nilai dari Secrets
      - name: Smoke test image backend
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e MYSQL_DATABASE=perpustakaan -e MYSQL_USER=app \
            -e MYSQL_PASSWORD="$DB_PASSWORD" -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" \
            mysql:8.4
          for i in $(seq 1 40); do
            docker exec db mysqladmin ping -h 127.0.0.1 -uroot -p"$DB_PASSWORD" --silent && break
            sleep 3
          done
          docker run -d --name backend --network smoke -p 8000:8000 \
            -e APP_KEY="$APP_KEY" -e DB_CONNECTION=mysql -e DB_HOST=db \
            -e DB_DATABASE=perpustakaan -e DB_USERNAME=app -e DB_PASSWORD="$DB_PASSWORD" \
            "$BACKEND_IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/up && break
            sleep 3
          done
          echo "--- API tanpa token harus 401 ---"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Accept: application/json" http://localhost:8000/api/buku
          docker logs backend

